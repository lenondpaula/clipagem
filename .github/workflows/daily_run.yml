name: Daily Clipagem Run

on:
  workflow_dispatch:

permissions:
  contents: write # Permissão para criar commits e push

jobs:
  clipagem-automation:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    
    steps:
      # ==================== CHECKOUT ====================
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== SETUP PYTHON ====================
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # ==================== INSTALAR DEPENDÊNCIAS ====================
      - name: 📦 Instalar dependências
        run: |
          echo "[INFO] Atualizando pip..."
          python -m pip install --upgrade pip
          
          echo "[INFO] Instalando requirements.txt..."
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "[WARN] requirements.txt não encontrado, instalando manualmente..."
            pip install playwright groq pymupdf streamlit requests python-dotenv
          fi
          
          echo "[INFO] Verificando instalações..."
          python -c "import playwright; print('✓ playwright')"
          python -c "import groq; print('✓ groq')"
          python -c "import fitz; print('✓ pymupdf')"
          python -c "import streamlit; print('✓ streamlit')"

      - name: 🎭 Instalar Chromium do Playwright
        run: |
          echo "[INFO] Instalando navegador Chromium do Playwright..."
          python -m playwright install --with-deps chromium

      # ==================== INSTALAR CHROME ====================
      - name: 🌐 Instalar Google Chrome
        run: |
          echo "[INFO] Atualizando lista de pacotes..."
          sudo apt-get update
          
          echo "[INFO] Instalando Google Chrome..."
          if ! sudo apt-get install -y google-chrome-stable; then
            echo "[WARN] apt-get falhou, tentando instalar via .deb..."
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb
            sudo apt-get install -y /tmp/google-chrome.deb
          fi
          
          echo "[INFO] Verificando instalação..."
          google-chrome --version
          which google-chrome

      # ==================== EXECUTAR DAILY SCRAPER ====================
      - name: 🔐 Carregar secrets do arquivo
        run: |
          printf '%s\n' "${{ secrets.SECRETES }}" > /tmp/secrets.env
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            case "$line" in
              \#*) continue ;;
            esac
            key="${line%%=*}"
            value="${line#*=}"
            if [ -n "$value" ] && [ "$key" != "$value" ]; then
              echo "::add-mask::$value"
            fi
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/secrets.env

      - name: 🤖 Executar Daily Scraper
        run: |
          echo "[RUN] Iniciando daily_scraper.py..."
          SCRAPER_TIMEOUT_SECONDS="${SCRAPER_TIMEOUT_SECONDS:-90}"
          echo "[RUN] Timeout objetivo do scraper: ${SCRAPER_TIMEOUT_SECONDS}s"
          set +e
          timeout --signal=TERM --kill-after=10s "${SCRAPER_TIMEOUT_SECONDS}" python -u src/daily_scraper.py
          exit_code=$?
          set -e

          if [ -f /tmp/scraper_stage.txt ]; then
            echo "[RUN] Última etapa registrada pelo scraper:"
            cat /tmp/scraper_stage.txt
          fi

          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ]; then
              echo "✗ ERRO: daily_scraper.py excedeu o tempo limite de ${SCRAPER_TIMEOUT_SECONDS}s"
            else
              echo "✗ ERRO: daily_scraper.py falhou com exit code ${exit_code}"
            fi
            exit "$exit_code"
          fi
          
          echo "[RUN] Verificando saída..."
          ls -lh data/
          
          if [ -f data/diario_sm_atual.pdf ]; then
            echo "✓ PDF baixado com sucesso!"
            file data/diario_sm_atual.pdf
          else
            echo "✗ ERRO: PDF não foi encontrado após execução"
            exit 1
          fi

      # ==================== EXECUTAR ANALYZER ====================
      - name: 🧠 Executar Analyzer
        run: |
          echo "[RUN] Iniciando analyzer.py..."
          python -u src/analyzer.py
          
          echo "[RUN] Verificando saída..."
          ls -lh data/
          
          if [ -f data/clipagem_hoje.json ]; then
            echo "✓ JSON de clipagem gerado com sucesso!"
            head -50 data/clipagem_hoje.json
          else
            echo "✗ ERRO: JSON não foi encontrado após execução"
            exit 1
          fi

      # ==================== AUTO-COMMIT ====================
      - name: 📝 Auto-Commit de Dados Alterados
        run: |
          echo "[COMMIT] Configurando Git..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "[COMMIT] Sincronizando com origin/main..."
          git pull --rebase origin main

          echo "[COMMIT] Verificando status..."
          git status
          
          echo "[COMMIT] Adicionando arquivos de data/..."
          git add -A data/
          
          echo "[COMMIT] Verificando diff..."
          git diff --cached --stat
          
          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "[COMMIT] Criando commit..."
            git commit -m "🔄 Auto-update: Clipagem e PDF do Diário de SM" \
              -m "- PDF: Edição de $(date '+%d/%m/%Y')" \
              -m "- Análise: Processada com Google Gemini 2.0 Flash" \
              -m "- Timestamp: $(date '+%Y-%m-%d %H:%M:%S')" \
              -m "[skip ci]" || true
            
            echo "[COMMIT] Fazendo push..."
            git push origin HEAD:main
            
            echo "✓ Dados commitados e atualizados com sucesso!"
          else
            echo "[COMMIT] Nenhuma mudança detectada, skipping commit..."
          fi

      # ==================== NOTIFICAÇÃO DE SUCESSO ====================
      - name: ✅ Notificação de Sucesso
        run: |
          echo "=========================================="
          echo "✓ EXECUÇÃO COMPLETADA COM SUCESSO"
          echo "=========================================="
          echo ""
          echo "Arquivos gerados:"
          ls -lh data/ 2>/dev/null || echo "Pasta data/ não encontrada"
          echo ""
          echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Timezone: $(date '+%Z')"

      # ==================== UPLOAD DE DEBUG EM CASO DE ERRO ====================
      - name: 🐛 Upload de Debug (screenshot + HTML)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug-${{ github.run_id }}
          path: |
            /tmp/scraper_stage.txt
            /tmp/scraper_stage_history.txt
            /tmp/login_page_loaded.*
            /tmp/login_username_not_found.*
            /tmp/login_password_not_found.*
            /tmp/login_button_not_found.*
            /tmp/login_error.*
            /tmp/playwright_error.*
            /tmp/playwright_timeout.*
            /tmp/listagem_logada.*
            /tmp/listagem_not_ready.*
            /tmp/listagem_cards_summary.txt
            /tmp/jornal_not_found.*
            /tmp/public_legal_filter_*.html
            /tmp/card_jornal.html
            /tmp/card_classificados.html
            /tmp/pdf_icon_context.html
            /tmp/filtro_debug.png
          if-no-files-found: ignore
          retention-days: 7

      # ==================== NOTIFICAÇÃO DE ERRO ====================
      - name: ❌ Notificação de Erro
        if: failure()
        run: |
          echo "=========================================="
          echo "✗ ERRO NA EXECUÇÃO DO WORKFLOW"
          echo "=========================================="
          echo ""
          echo "Verifique os logs acima para mais detalhes."
          echo "GitHub Actions URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          if [ -f /tmp/scraper_stage.txt ]; then
            echo "Última etapa registrada:"
            cat /tmp/scraper_stage.txt
            echo ""
          fi
          echo "Arquivos de debug disponíveis no artifact login-debug-${{ github.run_id }}"
          echo ""
          echo "Acesse: Actions > [Daily Clipagem Run] > Artifacts > login-debug-${{ github.run_id }}"
          exit 1
