name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    if: ${{ false }} # Pausado provisoriamente
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout codigo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install selenium webdriver-manager
          fi

      - name: 🌐 Instalar Google Chrome
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y google-chrome-stable; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb
            sudo apt-get install -y /tmp/google-chrome.deb
          fi
          google-chrome --version
          
          # Testar se Chrome funciona
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom https://www.google.com | head -20

      - name: 🔁 Rodar keep alive (Selenium)
        env:
          KEEP_ALIVE_URL: "https://clipagem-secom.streamlit.app/"
          KEEP_ALIVE_WAIT_SECONDS: "15"
          KEEP_ALIVE_SCREENSHOT: "keep_alive_screenshot.png"
        run: |
          echo "Iniciando keep-alive para: $KEEP_ALIVE_URL"
          
          # Executar com timeout para evitar travamentos
          timeout 300 python keep_alive.py
          
          # Verificar se screenshot foi criado
          if ls keep_alive_screenshot-*.png 1> /dev/null 2>&1; then
            echo "✅ Screenshot criado com sucesso"
            ls -la keep_alive_screenshot-*.png
          else
            echo "❌ Nenhum screenshot encontrado"
            exit 1
          fi
