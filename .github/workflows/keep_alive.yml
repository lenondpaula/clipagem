name: Keep Streamlit Alive

on:
  workflow_dispatch:

jobs:
  keep-alive:
    if: ${{ false }} # Pausado provisoriamente
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout codigo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright
          fi

      - name: 🎭 Instalar Chromium do Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: 🔁 Rodar keep alive (Playwright)
        env:
          KEEP_ALIVE_URL: "https://clipagem-secom.streamlit.app/"
          KEEP_ALIVE_WAIT_SECONDS: "10"
          KEEP_ALIVE_SCREENSHOT: "keep_alive_screenshot.png"
        run: |
          python keep_alive.py
